name: Gate

on:
  pull_request:
  push:
    branches:
      - main
      # The CI gate's fan-out branches (`.agent/ci-gate`, `.claude/rules/ops.md` Template rulings (5)).
      - "ci/**"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Each leg runs uv's newest build of its Python line; the image's own Python is an older patch.
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    # The one leg that grades history, on the latest Python line: D28 replays every range
    # revision without a green verdict (`.claude/rules/history-gates.md`), so a cold cache costs
    # one suite per revision.
    name: Full gate (Python 3.15, D28 included)
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.15"
          enable-cache: true
          prune-cache: true

      - name: Name a git identity for the suite's scratch repositories
        run: |
          git config --global user.name "cement-ci"
          git config --global user.email "cement-ci@users.noreply.github.com"

      - name: Restore D28 verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/cement-d28-verdicts
          key: d28-${{ runner.os }}-py3.15-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: d28-${{ runner.os }}-py3.15-${{ hashFiles('uv.lock') }}-

      - name: Run the full gate
        run: .agent/gate

      - name: Check that the gate left the tree clean
        # Every file a gate step writes is gitignored or removed (`CLAUDE.md` Execution: `.gitignore`
        # kept current; task close removes temporary artifacts).
        run: |
          status=$(git status --porcelain --untracked-files=all)
          printf '%s\n' "$status"
          test -z "$status"

      - name: Save D28 verdicts
        # Green verdicts only ever enter the store, so saving after a failed or cancelled run is safe.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/cement-d28-verdicts
          key: d28-${{ runner.os }}-py3.15-${{ hashFiles('uv.lock') }}-${{ github.run_id }}

  split:
    # A NAMED split run: every check except D28, on the Kimi target's Python (the nucllei jail
    # runs 3.12); the full leg covers the latest line.
    name: Split gate (Python ${{ matrix.python-version }}, D28 omitted)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true

      - name: Name a git identity for the suite's scratch repositories
        run: |
          git config --global user.name "cement-ci"
          git config --global user.email "cement-ci@users.noreply.github.com"

      - name: Run the gate without D28
        run: .agent/gate --omit-d28

      - name: Check that the gate left the tree clean
        # Every file a gate step writes is gitignored or removed (`CLAUDE.md` Execution: `.gitignore`
        # kept current; task close removes temporary artifacts).
        run: |
          status=$(git status --porcelain --untracked-files=all)
          printf '%s\n' "$status"
          test -z "$status"
