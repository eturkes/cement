name: Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    # The one leg that grades history: D28 replays every range revision without a green verdict
    # (`.claude/rules/history-gates.md`), so a cold cache costs one suite per revision.
    name: Full gate (Python 3.13, D28 included)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Name a git identity for the suite's scratch repositories
        run: |
          git config --global user.name "cement-ci"
          git config --global user.email "cement-ci@users.noreply.github.com"

      - name: Restore D28 verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/cement-d28-verdicts
          key: d28-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: d28-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}-

      - name: Run the full gate
        run: .agent/gate

      - name: Save D28 verdicts
        # Green verdicts only ever enter the store, so saving after a failed or cancelled run is safe.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/cement-d28-verdicts
          key: d28-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}-${{ github.run_id }}

  split:
    # A NAMED split run: every check except D28, on the other supported Pythons.
    name: Split gate (Python ${{ matrix.python-version }}, D28 omitted)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.14"
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true

      - name: Name a git identity for the suite's scratch repositories
        run: |
          git config --global user.name "cement-ci"
          git config --global user.email "cement-ci@users.noreply.github.com"

      - name: Run the gate without D28
        run: .agent/gate --omit-d28
