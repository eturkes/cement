[project]
name = "cement-runtime"
version = "0.2.0"
description = "Supervised LLM fallback that compiles confirmed behavior into exact deterministic artifacts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cement = "cement_runtime.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cement_runtime"
source-include = ["docs/**", "examples/**", "tests/**"]

[dependency-groups]
dev = [
    "cosmic-ray==8.7.0",
    "mypy==2.4.0",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# tests/ + .agent/ pin live source text (`inspect.getsource`, byte freezes), so the formatter
# never touches them; prototype/ runs under PROTOTYPE law (`.claude/rules/ops.md`).
extend-exclude = ["tests", ".agent", "prototype"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "RUF", "C4", "SIM", "PIE", "RET", "PERF", "FURB",
    "ERA", "ARG", "BLE", "T20", "ISC", "PGH", "PLE", "PLW", "TID", "FLY", "N",
]
# SIM105: an explicit `try`/`except X: pass` names the swallowed class at the call site, where
# `contextlib.suppress` moves it into a context manager; the runtime's totality reviews read it.
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
# The demo's verdicts are asserts behind its own `-O` refusal, and its transcript is stdout.
"examples/hospital_ocr/**" = ["S101", "T201"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/cement_runtime"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
