[project]
name = "cement-runtime"
version = "0.1.0"
description = "Supervised LLM fallback that compiles confirmed behavior into exact deterministic artifacts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cement = "cement_runtime.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cement_runtime"
source-include = ["docs/**", "examples/**", "tests/**"]
